<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻译参考对照表</title>
<style>
  :root {
    --primary: #2B3F5F;
    --text: #1A1A1A;
    --muted: #666666;
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --border: #E5E7EB;
    --accent: #2B3F5F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 20px;
    background: linear-gradient(135deg, #2B3F5F 0%, #1A1A1A 120%);
    color: #fff;
  }
  header h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: 13px; opacity: .85; }
  header .stat { margin-top: 10px; font-size: 13px; opacity: .9; }
  header .stat b { color: #fff; }
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 12px; align-items: center;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .toolbar input {
    flex: 1; max-width: 420px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .toolbar select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
    outline: none;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .toolbar select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(43,63,95,.12);
  }
  .toolbar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(43,63,95,.12);
  }
  .toolbar .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .table-wrap {
    margin: 16px 24px 40px;
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  table { border-collapse: collapse; width: 100%; min-width: 860px; }
  thead th {
    position: sticky; top: 56px; z-index: 4;
    background: #F0F2F5;
    color: var(--primary);
    font-weight: 700;
    text-align: left;
    padding: 12px 16px;
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: background .15s;
  }
  thead th:hover { background: #E6E9EE; }
  thead th .arrow { font-size: 11px; opacity: .4; margin-left: 4px; }
  thead th.sorted .arrow { opacity: 1; color: var(--accent); }
  tbody td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    word-break: break-word;
  }
  tbody tr.group-row td {
    background: linear-gradient(135deg, #2B3F5F 0%, #1A1A1A 120%);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .4px;
    padding: 11px 16px;
    cursor: default;
  }
  tbody tr.group-row td .gcount {
    float: right;
    font-weight: 400;
    opacity: .8;
    font-size: 12px;
  }
  tbody tr.group-row td:hover { background: linear-gradient(135deg, #2B3F5F 0%, #1A1A1A 120%); }
  tbody tr:nth-child(even) { background: #FAFBFC; }
  tbody tr:hover { background: #EEF2F8; }
  td.missing { color: #9CA3AF; font-style: italic; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { padding: 0 24px 32px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>翻译参考对照表</h1>
  <div class="sub">简体中文 / 繁體中文 / English / Indonesian</div>
  <div class="stat">共 <b id="totalCount">0</b> 个翻译键（key），缺失项以 <b>—</b> 标注。</div>
</header>
<div class="toolbar">
  <select id="groupSel" aria-label="按一级命名空间分组筛选">
    <option value="__ALL__">全部分组</option>
  </select>
  <input id="search" type="text" placeholder="搜索任意语言译文…" autocomplete="off">
  <span class="count" id="matchCount"></span>
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr id="headRow"></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">未找到匹配的翻译项</div>
</div>
<footer></footer>

  {"key":"orders.noticeRules.1","zh-CN":"领取前请检查车辆/电池状态，确认物品状况及性能完好","zh-HK":"領取前請檢查車輛/電池狀態，確認物品狀況及性能完好","en":"Before pickup, inspect the vehicle/battery status and confirm the item is in good condition and working order.","id":"Sebelum pengambilan, periksa kondisi kendaraan/baterai dan pastikan barang dalam keadaan baik dan berfungsi normal."},
  {"key":"orders.noticeRules.2","zh-CN":"仅限下单本人领取，不支持代领","zh-HK":"僅限下單本人領取，不支援代領","en":"Only the person who placed the order may pick up the item; proxy pickup is not supported.","id":"Hanya pemesan yang bersangkutan yang dapat mengambil; pengambilan oleh orang lain tidak didukung."},
  {"key":"orders.noticeRules.3","zh-CN":"车辆/电池损坏需按实际维修费用赔偿","zh-HK":"車輛/電池損壞需按實際維修費用賠償","en":"Damage to the vehicle/battery will be compensated at the actual repair cost.","id":"Kerusakan pada kendaraan/baterai akan diganti sesuai biaya perbaikan yang sebenarnya."},
  {"key":"orders.noticeRules.4","zh-CN":"请遵守当地交通法规，安全骑行","zh-HK":"請遵守當地交通法規，安全騎行","en":"Please comply with local traffic regulations and ride safely.","id":"Harap patuhi peraturan lalu lintas setempat dan berkendara dengan aman."},
  {"key":"orders.noticeRules.5","zh-CN":"库存以门店实际现货为准，建议提前联系门店确认咨询","zh-HK":"庫存以門店實際現貨為準，建議提前聯絡門店確認諮詢","en":"Inventory is subject to on-site store stock; we recommend contacting the store in advance to confirm.","id":"Stok mengikuti ketersediaan toko secara langsung; disarankan menghubungi toko terlebih dahulu untuk konfirmasi."},
  {"key":"orders.billingRules.1","zh-CN":"计费起始时间以用户领取车辆/电池时间为准，计费终止时间以车辆/电池完成归还时间为准","zh-HK":"計費起始時間以用戶領取車輛/電池時間為準，計費終止時間以車輛/電池完成歸還時間為準","en":"Billing starts when the user picks up the vehicle/battery and ends when the vehicle/battery is fully returned.","id":"Waktu penagihan dimulai saat pengguna mengambil kendaraan/baterai dan berakhir saat kendaraan/baterai selesai dikembalikan."},
  {"key":"orders.billingRules.2","zh-CN":"周期租金根据订单选定租赁方案进行核算","zh-HK":"週期租金根據訂單選定租賃方案進行核算","en":"Periodic rent is calculated based on the rental plan selected for the order.","id":"Sewa periode dihitung berdasarkan paket sewa yang dipilih untuk pesanan."},
  {"key":"orders.billingRules.3","zh-CN":"租赁时长不足1个周期的，按1个周期计费","zh-HK":"租賃時長不足1個週期的，按1個週期計費","en":"If the rental duration is less than one billing period, it is charged as one period.","id":"Jika durasi sewa kurang dari satu periode, dihitung sebagai satu periode."},
  {"key":"orders.cancelRules.1","zh-CN":"订单尚未支付，用户可自行操作取消订单","zh-HK":"訂單尚未支付，用戶可自行操作取消訂單","en":"If the order has not been paid, the user may cancel it on their own.","id":"Jika pesanan belum dibayar, pengguna dapat membatalkannya secara mandiri."},
  {"key":"orders.cancelRules.2","zh-CN":"订单已支付但未领取车辆/电池，用户可自行操作取消订单","zh-HK":"訂單已支付但未領取車輛/電池，用戶可自行操作取消訂單","en":"If the order has been paid but the vehicle/battery has not been picked up, the user may cancel it on their own.","id":"Jika pesanan telah dibayar tetapi kendaraan/baterai belum diambil, pengguna dapat membatalkannya secara mandiri."},
  {"key":"orders.cancelRules.3","zh-CN":"领取车辆/电池后，需与商家协商处理，具体退费以双方协商结果为准","zh-HK":"領取車輛/電池後，需與商戶協商處理，具體退費以雙方協商結果為準","en":"After picking up the vehicle/battery, cancellation requires negotiation with the merchant; the actual refund is subject to the agreement between both parties.","id":"Setelah mengambil kendaraan/baterai, pembatalan perlu dibicarakan dengan merchant; pengembalian dana ditentukan berdasarkan kesepakatan kedua belah pihak."},
  {"key":"orders.cancelRules.4","zh-CN":"租金、押金将在订单取消后于 7 个工作日内按原支付路径退还","zh-HK":"租金、押金將在訂單取消後於 7 個工作日內按原支付路徑退還","en":"Rent and deposit will be refunded via the original payment method within 7 business days after the order is canceled.","id":"Sewa dan deposit akan dikembalikan melalui metode pembayaran asli dalam 7 hari kerja setelah pesanan dibatalkan."},
  {"key":"orders.overdueRules.1","zh-CN":"请在订单约定归还时间内完成车辆/电池归还","zh-HK":"請在訂單約定歸還時間內完成車輛/電池歸還","en":"Please return the vehicle/battery within the return time agreed in the order.","id":"Harap kembalikan kendaraan/baterai dalam waktu pengembalian yang disepakati dalam pesanan."},
  {"key":"orders.overdueRules.2","zh-CN":"若发生逾期归还，商家可选择从押金抵扣逾期产生的相关费用","zh-HK":"若發生逾期歸還，商戶可選擇從押金抵扣逾期產生的相關費用","en":"In case of overdue return, the merchant may deduct the related overdue charges from the deposit.","id":"Jika terjadi pengembalian terlambat, merchant dapat memotong biaya terkait keterlambatan dari deposit."},
  {"key":"orders.overdueRules.3","zh-CN":"押金抵扣不足的，商家有权向用户追偿差额","zh-HK":"押金抵扣不足的，商戶有權向用戶追償差額","en":"If the deposit is insufficient to cover the deduction, the merchant has the right to claim the difference from the user.","id":"Jika deposit tidak cukup untuk potongan, merchant berhak menagih selisihnya kepada pengguna."},
  {"key":"orders.overdueRules.4","zh-CN":"逾期超过约定天数未归还，商家有权对车辆进行远程锁定","zh-HK":"逾期超過約定天數未歸還，商戶有權對車輛進行遠程鎖定","en":"If the vehicle is not returned beyond the agreed number of days, the merchant has the right to remotely lock the vehicle.","id":"Jika kendaraan tidak dikembalikan melewati jumlah hari yang disepakati, merchant berhak mengunci kendaraan secara jarak jauh."},

const LANG_COLS = [{"title": "简体中文", "code": "zh-CN"}, {"title": "繁體中文", "code": "zh-HK"}, {"title": "English", "code": "en"}, {"title": "Indonesian", "code": "id"}];
const MISSING = "—";

// 一级分组 key → 中文显示名
const GROUP_LABELS = {
  "tab": "底部导航",
  "login": "登录",
  "home": "主页",
  "vehicles": "车辆",
  "orders": "订单",
  "profile": "我的 / 账号",
  "version": "版本更新",
  "dialcode": "国家/地区区号",
  "toast": "提示",
  "common": "通用",
  "store": "选择门店",
  "plan": "选择方案",
  "battery": "电池",
  "idInfo": "证件信息",
  "pwd": "修改密码",
  "scan": "扫码",
  "weekday": "星期",
};
function groupLabel(g) {
  return GROUP_LABELS[g] || g;
}

const tbody = document.getElementById('tbody');
const headRow = document.getElementById('headRow');
const searchInput = document.getElementById('search');
const matchCount = document.getElementById('matchCount');
const emptyState = document.getElementById('emptyState');
document.getElementById('totalCount').textContent = ROWS.length;

// 构建表头（仅语言列，无 key 列）
const columns = LANG_COLS;
let sortCol = null; // 初始不排序：组内按源码（ROWS）关联顺序展示
let sortDir = 1; // 1 升序, -1 降序
let activeGroup = '__ALL__'; // 当前选中的一级分组

// 一级分组的业务展示顺序（按用户使用流程：登录 → 导航 → 核心业务 → 个人中心 → 支撑模块）
const GROUP_ORDER = [
  "common",     // 通用
  "login",      // 登录
  "dialcode",   // 国家/地区区号
  "tab",        // 底部导航
  "home",       // 主页
  "store",      // 选择门店
  "plan",       // 选择方案
  "orders",     // 我的订单
  "vehicles",   // 我的爱车 / 车辆
  "battery",    // 电池
  "scan",       // 扫码
  "profile",    // 我的 / 个人信息
  "pwd",        // 修改密码
  "idInfo",     // 证件信息
  "weekday",    // 星期
  "version",    // 版本更新
  "toast"       // 提示
];
// 派生一级分组：以业务顺序为准，未列出的按字母序补在末尾
const allGroups = Array.from(new Set(ROWS.map(r => r.key.split('.')[0])));
const GROUPS = [
  ...GROUP_ORDER.filter(g => allGroups.includes(g)),
  ...allGroups.filter(g => !GROUP_ORDER.includes(g)).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN', { numeric: true }))
];

// 初始化分组下拉框
const groupSel = document.getElementById('groupSel');
GROUPS.forEach(g => {
  const opt = document.createElement('option');
  opt.value = g;
  const cnt = ROWS.filter(r => r.key.split('.')[0] === g).length;
  opt.textContent = `${groupLabel(g)} (${cnt})`;
  groupSel.appendChild(opt);
});
groupSel.addEventListener('change', () => {
  activeGroup = groupSel.value;
  render();
});

columns.forEach(col => {
  const th = document.createElement('th');
  th.dataset.code = col.code;
  th.innerHTML = col.title + '<span class="arrow">▲</span>';
  th.addEventListener('click', () => {
    if (sortCol === col.code) {
      sortDir = -sortDir;
    } else {
      sortCol = col.code;
      sortDir = 1;
    }
    render();
  });
  headRow.appendChild(th);
});

function getVal(row, code) {
  const v = row[code];
  return (v === undefined || v === null || v === '') ? MISSING : v;
}

function groupOf(row) {
  return row.key.split('.')[0];
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  let list = ROWS.filter(r => {
    if (activeGroup !== '__ALL__' && groupOf(r) !== activeGroup) return false;
    if (!q) return true;
    return LANG_COLS.some(c => getVal(r, c.code).toLowerCase().includes(q));
  });

  // 仅在用户点击表头后排序；初始保持源码（ROWS）关联顺序
  if (sortCol !== null) {
    list = list.slice().sort((a, b) => {
      const av = getVal(a, sortCol).toLowerCase();
      const bv = getVal(b, sortCol).toLowerCase();
      return av.localeCompare(bv, 'zh-Hans-CN', { numeric: true }) * sortDir;
    });
  }

  // 更新表头指示
  [...headRow.children].forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (sortCol !== null && th.dataset.code === sortCol) {
      th.classList.add('sorted');
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
    } else {
      th.classList.remove('sorted');
      arrow.textContent = '▲';
    }
  });

  tbody.innerHTML = '';

  // 统一按分组渲染：全部分组时列出所有可见分组，筛选单组时只列该组；每组均显示标题行
  const groupsToShow = activeGroup === '__ALL__'
    ? GROUPS.filter(g => list.some(r => groupOf(r) === g))
    : [activeGroup];
  groupsToShow.forEach(g => {
    const items = list.filter(r => groupOf(r) === g);
    if (!items.length) return;
    const gr = document.createElement('tr');
    gr.className = 'group-row';
    const gt = document.createElement('td');
    gt.colSpan = columns.length;
    gt.innerHTML = `${groupLabel(g)}<span class="gcount">${items.length} 项</span>`;
    gr.appendChild(gt);
    tbody.appendChild(gr);
    items.forEach(r => tbody.appendChild(buildRow(r)));
  });

  matchCount.textContent = `匹配 ${list.length} / ${ROWS.length}`;
  emptyState.style.display = list.length ? 'none' : 'block';
}

function buildRow(r) {
  const tr = document.createElement('tr');
  LANG_COLS.forEach(c => {
    const td = document.createElement('td');
    const v = getVal(r, c.code);
    td.textContent = v;
    if (v === MISSING) td.className = 'missing';
    tr.appendChild(td);
  });
  return tr;
}

searchInput.addEventListener('input', render);
render();
</script>
</body>
</html>
