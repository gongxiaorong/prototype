<meta charset="UTF-8">

<title>翻译参考对照表</title>
<style>
  :root {
    --primary: #2B3F5F;
    --text: #1A1A1A;
    --muted: #666666;
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --border: #E5E7EB;
    --accent: #2B3F5F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 20px;
    background: linear-gradient(135deg, #2B3F5F 0%, #1A1A1A 120%);
    color: #fff;
  }
  header h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: 13px; opacity: .85; }
  header .stat { margin-top: 10px; font-size: 13px; opacity: .9; }
  header .stat b { color: #fff; }
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 12px; align-items: center;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .toolbar input {
    flex: 1; max-width: 420px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .toolbar select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
    outline: none;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .toolbar select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(43,63,95,.12);
  }
  .toolbar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(43,63,95,.12);
  }
  .toolbar .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .table-wrap {
    margin: 16px 24px 40px;
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  table { border-collapse: collapse; width: 100%; min-width: 860px; }
  thead th {
    position: sticky; top: 56px; z-index: 4;
    background: #F0F2F5;
    color: var(--primary);
    font-weight: 700;
    text-align: left;
    padding: 12px 16px;
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: background .15s;
  }
  thead th:hover { background: #E6E9EE; }
  thead th .arrow { font-size: 11px; opacity: .4; margin-left: 4px; }
  thead th.sorted .arrow { opacity: 1; color: var(--accent); }
  tbody td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    word-break: break-word;
  }
  tbody tr.group-row td {
    background: linear-gradient(135deg, #2B3F5F 0%, #1A1A1A 120%);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .4px;
    padding: 11px 16px;
    cursor: default;
  }
  tbody tr.group-row td .gcount {
    float: right;
    font-weight: 400;
    opacity: .8;
    font-size: 12px;
  }
  tbody tr.group-row td:hover { background: linear-gradient(135deg, #2B3F5F 0%, #1A1A1A 120%); }
  tbody tr:nth-child(even) { background: #FAFBFC; }
  tbody tr:hover { background: #EEF2F8; }
  td.missing { color: #9CA3AF; font-style: italic; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { padding: 0 24px 32px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>翻译参考对照表</h1>
  <div class="sub">简体中文 / 繁體中文 / English / Indonesian</div>
  <div class="stat">共 <b id="totalCount">648</b> 个翻译键（key），缺失项以 <b>—</b> 标注。</div>
</header>
<div class="toolbar">
  <select id="groupSel" aria-label="按一级命名空间分组筛选">
    <option value="__ALL__">全部分组</option>
  </select>
  <input id="search" type="text" placeholder="搜索任意语言译文…" autocomplete="off">
  <span class="count" id="matchCount"></span>
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr id="headRow"></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">未找到匹配的翻译项</div>
</div>
<footer></footer>

    {"key":"vehicles.commandLock","zh-CN":"开关锁","zh-HK":"開關鎖","en":"Lock/Unlock","id":"Kunci/Buka Kunci"}
];
// 移除指定 key（如 APP 标题行 login.title）
ROWS = ROWS.filter(r => r.key !== "login.title");

const LANG_COLS = [{"title": "简体中文", "code": "zh-CN"}, {"title": "繁體中文", "code": "zh-HK"}, {"title": "English", "code": "en"}, {"title": "Indonesian", "code": "id"}];
const MISSING = "—";

// 一级分组 key → 中文显示名
const GROUP_LABELS = {
  "alert": "告警",
  "common": "通用",
  "dialcode": "国家/地区区号",
  "home": "首页",
  "login": "登录",
  "orders": "订单",
  "perm": "权限",
  "profile": "我的 / 账号",
  "tab": "底部导航",
  "toast": "提示",
  "vehicles": "车辆",
  "version": "版本更新",
  "battery": "电池",
  "package": "套餐"
};
function groupLabel(g) {
  return GROUP_LABELS[g] || g;
}

const tbody = document.getElementById('tbody');
const headRow = document.getElementById('headRow');
const searchInput = document.getElementById('search');
const matchCount = document.getElementById('matchCount');
const emptyState = document.getElementById('emptyState');
document.getElementById('totalCount').textContent = ROWS.length;

// 构建表头（仅语言列，无 key 列）
const columns = LANG_COLS;
let sortCol = null; // 初始不排序：组内按源码（ROWS）关联顺序展示
let sortDir = 1; // 1 升序, -1 降序
let activeGroup = '__ALL__'; // 当前选中的一级分组

// 一级分组的业务展示顺序（按用户使用流程：登录 → 导航 → 核心业务 → 个人中心 → 支撑模块）
const GROUP_ORDER = [
  "common",     // 通用
  "login",      // 登录
  "tab",        // 底部导航
  "home",       // 首页
  "orders",     // 订单
  "vehicles",   // 车辆
  "profile",    // 我的 / 账号
  "perm",       // 权限
  "toast",      // 提示
  "alert",      // 告警
  "version",    // 版本更新
  "dialcode"    // 国家/地区区号
];
// 派生一级分组：以业务顺序为准，未列出的按字母序补在末尾
const allGroups = Array.from(new Set(ROWS.map(r => r.key.split('.')[0])));
const GROUPS = [
  ...GROUP_ORDER.filter(g => allGroups.includes(g)),
  ...allGroups.filter(g => !GROUP_ORDER.includes(g)).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN', { numeric: true }))
];

// 初始化分组下拉框
const groupSel = document.getElementById('groupSel');
GROUPS.forEach(g => {
  const opt = document.createElement('option');
  opt.value = g;
  const cnt = ROWS.filter(r => r.key.split('.')[0] === g).length;
  opt.textContent = `${groupLabel(g)} (${cnt})`;
  groupSel.appendChild(opt);
});
groupSel.addEventListener('change', () => {
  activeGroup = groupSel.value;
  render();
});

columns.forEach(col => {
  const th = document.createElement('th');
  th.dataset.code = col.code;
  th.innerHTML = col.title + '<span class="arrow">▲</span>';
  th.addEventListener('click', () => {
    if (sortCol === col.code) {
      sortDir = -sortDir;
    } else {
      sortCol = col.code;
      sortDir = 1;
    }
    render();
  });
  headRow.appendChild(th);
});

function getVal(row, code) {
  const v = row[code];
  return (v === undefined || v === null || v === '') ? MISSING : v;
}

function groupOf(row) {
  return row.key.split('.')[0];
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  let list = ROWS.filter(r => {
    if (activeGroup !== '__ALL__' && groupOf(r) !== activeGroup) return false;
    if (!q) return true;
    return LANG_COLS.some(c => getVal(r, c.code).toLowerCase().includes(q));
  });

  // 仅在用户点击表头后排序；初始保持源码（ROWS）关联顺序
  if (sortCol !== null) {
    list = list.slice().sort((a, b) => {
      const av = getVal(a, sortCol).toLowerCase();
      const bv = getVal(b, sortCol).toLowerCase();
      return av.localeCompare(bv, 'zh-Hans-CN', { numeric: true }) * sortDir;
    });
  }

  // 更新表头指示
  [...headRow.children].forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (sortCol !== null && th.dataset.code === sortCol) {
      th.classList.add('sorted');
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
    } else {
      th.classList.remove('sorted');
      arrow.textContent = '▲';
    }
  });

  tbody.innerHTML = '';

  if (activeGroup === '__ALL__') {
    // 按一级分组聚合渲染
    const byGroup = {};
    list.forEach(r => {
      const g = groupOf(r);
      (byGroup[g] = byGroup[g] || []).push(r);
    });
    GROUPS.forEach(g => {
      const items = byGroup[g];
      if (!items || items.length === 0) return;
      const gr = document.createElement('tr');
      gr.className = 'group-row';
      const gt = document.createElement('td');
      gt.colSpan = columns.length;
      gt.innerHTML = `${groupLabel(g)}<span class="gcount">${items.length} 项</span>`;
      gr.appendChild(gt);
      tbody.appendChild(gr);
      items.forEach(r => tbody.appendChild(buildRow(r)));
    });
  } else {
    // 单组直接渲染数据行
    list.forEach(r => tbody.appendChild(buildRow(r)));
  }

  matchCount.textContent = `匹配 ${list.length} / ${ROWS.length}`;
  emptyState.style.display = list.length ? 'none' : 'block';
}

function buildRow(r) {
  const tr = document.createElement('tr');
  LANG_COLS.forEach(c => {
    const td = document.createElement('td');
    const v = getVal(r, c.code);
    td.textContent = v;
    if (v === MISSING) td.className = 'missing';
    tr.appendChild(td);
  });
  return tr;
}

searchInput.addEventListener('input', render);
render();
</script>
