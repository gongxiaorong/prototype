
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>电动车租赁商户管理端 · 首页</title>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>
<style>
/* ══════ GLOBAL: reset · body · stage ══════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',system-ui,sans-serif;background:#E8EAED;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#111;padding:24px}
.od-stage{display:flex;align-items:stretch;justify-content:center;gap:32px;max-width:100%}
/* ══════ GLOBAL: demo-ops 调试面板 ══════ */
.demo-ops{width:280px;min-width:280px;flex-shrink:0;align-self:center;box-sizing:border-box;max-height:852px;overflow-y:auto}
.demo-ops.is-active{background:#fff;border:1px solid #E5E5E5;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.demo-ops:not(.is-active){visibility:hidden;pointer-events:none;border:0;padding:0;background:transparent;box-shadow:none}
.demo-ops-title{font-size:20px;font-weight:600;color:#111;letter-spacing:.02em;margin-bottom:14px}
.demo-ops-meta{background:#F6F7F9;border:1px solid #E5E5E5;border-radius:8px;padding:12px;margin-bottom:16px;font-size:12px;line-height:1.6}
.demo-ops-meta .k{color:#6B6B6B}.demo-ops-meta .v{color:#111;font-weight:500;word-break:break-all}
.demo-ops-btn{width:100%;padding:12px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;border:1px solid #E5E5E5;background:#fff;color:#111;margin-bottom:8px;transition:background .15s,border-color .15s,opacity .15s}
.demo-ops-btn:hover:not(:disabled){background:#F6F7F9}
.demo-ops-btn:active:not(:disabled){opacity:.85}
.demo-ops-btn:disabled{opacity:.45;cursor:not-allowed}
.demo-ops-btn.primary{background:#ECFDF3;border-color:#BBF7D0;color:#17A34A}
.demo-ops-btn.primary:hover:not(:disabled){background:#DCFCE7}
.demo-ops-btn.secondary{background:#EBF1FD;border-color:#BFDBFE;color:#2F6FEB}
.demo-ops-btn.secondary:hover:not(:disabled){background:#DBEAFE}
.demo-ops-label{font-size:12px;font-weight:600;color:#6B6B6B;margin-bottom:8px}
.demo-ops-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.demo-ops-chip{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #E5E5E5;background:#fff;color:#666;transition:background .15s,border-color .15s,color .15s,opacity .15s;user-select:none}
.demo-ops-chip:hover{background:#F6F7F9}
.demo-ops-chip.is-on{background:#2F6FEB;border-color:#2F6FEB;color:#fff}
.demo-ops-chip.is-on-warn{background:#FFFBEB;border-color:#F59E0B;color:#F59E0B}
.demo-ops-chip.is-on-ok{background:#F0FDF4;border-color:#17A34A;color:#17A34A}
.demo-ops-section+.demo-ops-section{margin-top:4px;padding-top:12px;border-top:1px solid #E5E5E5}
.demo-ops-chip.is-off{opacity:.55;text-decoration:line-through}
.demo-ops-perm-g{margin-bottom:10px}
.demo-ops-perm-g:last-child{margin-bottom:0}
.demo-ops-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.demo-ops-link{font-size:11px;font-weight:600;color:#2F6FEB;cursor:pointer;user-select:none}
.demo-ops-link:active{opacity:.7}
/* ══════ GLOBAL: utilities · transitions · toast · 共享组件 (cb / card-actions / ptr / tab-fade) ══════ */
.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}
.hid::-webkit-scrollbar{display:none}.hid{scrollbar-width:none}
.sl-enter-active,.sl-leave-active{transition:transform .28s cubic-bezier(.32,.72,0,1)}.sl-enter-from,.sl-leave-to{transform:translateX(100%)}
.fd-enter-active,.fd-leave-active{transition:opacity .25s}.fd-enter-from,.fd-leave-to{opacity:0}
.sh-enter-active,.sh-leave-active{transition:transform .3s cubic-bezier(.32,.72,0,1)}.sh-enter-from,.sh-leave-to{transform:translateY(100%)}
@keyframes spin{to{transform:rotate(360deg)}}.anim-spin{animation:spin 1s linear infinite}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:400px 100%;animation:shimmer 1.5s infinite;border-radius:4px}
.sk{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:400px 100%;animation:shimmer 1.5s infinite;border-radius:4px}
.filter-tabs{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;user-select:none;width:100%;flex-wrap:nowrap;white-space:nowrap;cursor:grab}
.filter-tabs::-webkit-scrollbar{display:none}.filter-tabs:active{cursor:grabbing}
.filter-pill{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0}
.item-enter-active{transition:all .35s cubic-bezier(.32,.72,0,1)}.item-enter-from{opacity:0;transform:translateY(12px)}
.toast-wrap{position:absolute;top:50px;left:16px;right:16px;z-index:99999;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.toast-item{padding:10px 20px;border-radius:12px;font-size:14px;font-weight:500;color:#fff;pointer-events:auto;backdrop-filter:blur(10px);text-align:center;max-width:80%;line-height:1.4}
.toast-success{background:rgba(23,163,74,.9)}.toast-error{background:rgba(220,38,38,.9)}.toast-info{background:rgba(47,111,235,.9)}.toast-warn{background:rgba(217,119,6,.9)}
.toast-enter-active{transition:all .3s cubic-bezier(.32,.72,0,1)}.toast-leave-active{transition:all .25s ease-in}
.toast-enter-from{opacity:0;transform:translateY(-20px) scale(.9)}.toast-leave-to{opacity:0;transform:translateY(-10px) scale(.95)}
input[type=date],select{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.cb{width:20px;height:20px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid #E5E5E5;transition:all .15s}
.cb.on{background:#2F6FEB;border-color:#2F6FEB;color:#fff}.cb.pt{border-color:#2F6FEB;color:#2F6FEB;background:#fff}
.card-actions{display:flex;border-top:1px solid #E5E5E5;margin-top:0}
.card-action-btn{flex:1;padding:10px 0;font-size:13px;font-weight:600;text-align:center;cursor:pointer;user-select:none;transition:opacity .15s}
.card-action-btn:active{opacity:.8}
.card-action-btn + .card-action-btn{border-left:1px solid #E5E5E5}
.ptr-indicator{overflow:hidden;transition:height .2s;height:0;text-align:center;font-size:12px;color:#999;line-height:40px;flex-shrink:0}
.ptr-indicator .ptr-spinner{display:inline-block;width:16px;height:16px;border:2px solid #E5E5E5;border-top-color:#2F6FEB;border-radius:50%;vertical-align:middle;margin-right:6px;animation:ptr-spin .6s linear infinite}
@keyframes ptr-spin{to{transform:rotate(360deg)}}
.tab-fade-enter-active,.tab-fade-leave-active{transition:opacity .2s ease,transform .2s ease}
.tab-fade-enter-from{opacity:0;transform:translateY(6px)}
.tab-fade-leave-to{opacity:0;transform:translateY(-6px)}
/* ══════ TAB: vehicles — 扫码 + track-map ══════ */
.scan-frame{width:220px;height:220px;border:2px solid rgba(255,255,255,.6);border-radius:16px;position:relative;overflow:hidden}
.scan-line{position:absolute;left:4px;right:4px;height:2px;background:#2F6FEB;animation:scan-move 2s ease-in-out infinite}
@keyframes scan-move{0%{top:4px}50%{top:212px}100%{top:4px}}
.track-map{background:#E8EEF5;background-image:linear-gradient(rgba(47,111,235,.06)1px,transparent 1px),linear-gradient(90deg,rgba(47,111,235,.06)1px,transparent 1px);background-size:28px 28px}
.track-wheel-col{flex:1;height:180px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;mask-image:linear-gradient(to bottom,transparent,black 28%,black 72%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,black 28%,black 72%,transparent)}
.track-wheel-col::-webkit-scrollbar{display:none}
.track-wheel-item{height:36px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:16px;color:#999;flex-shrink:0}
.track-wheel-item.is-on{color:#111;font-weight:600;font-size:17px}
.track-wheel-mask{position:absolute;left:0;right:0;top:50%;height:36px;margin-top:-18px;pointer-events:none;border-top:1px solid #E5E5E5;border-bottom:1px solid #E5E5E5;background:rgba(47,111,235,.04)}
.track-poi{position:absolute;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-[5]}
.track-poi-dot{width:8px;height:8px;border-radius:50%;background:#6B6B6B;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.track-poi-label{margin-top:3px;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:500;color:#6B6B6B;background:rgba(255,255,255,.92);border:1px solid #E5E5E5;white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis}
.track-end-pin{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18)}
/* ══════ TAB: login/auth — 登录流程（含共享 form-card） ══════ */
.login-field{box-sizing:border-box;min-height:48px;background:#F7F8FA;border:1px solid #EBEDF0;border-radius:12px;box-shadow:none;outline:none}
.login-field input,.login-field select{box-sizing:border-box;border:0!important;outline:none!important;box-shadow:none!important;background:transparent!important;-webkit-appearance:none;appearance:none;width:100%}
.login-field-dial{min-width:5.5rem;padding:0 12px;gap:4px;cursor:pointer;flex-shrink:0}
.login-field-dial:active{background:#EEE}
/* 方案 A：灰底 canvas + 白卡 surface + 卡内浅灰 field */
.form-card{background:#fff;border:1px solid #E5E5E5;border-radius:12px;padding:16px 16px 8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.form-card .form-row{margin-bottom:16px}
.form-card .form-row:last-child{margin-bottom:8px}
.form-card .form-label{font-size:13px;font-weight:500;color:#6B6B6B;margin-bottom:6px}
.form-card .form-hint{font-size:12px;margin-top:6px}
.form-card .form-actions{margin:4px 0 8px}
.login-code-btn{border:none;min-width:7.25rem;min-height:48px;background:#F0F1F3;color:#9CA3AF;border-radius:12px;transition:background .15s,color .15s}
.login-code-btn.is-on{background:#EBF1FD;color:#2F6FEB}
.login-code-btn.is-cd{background:#F5F6F8;color:#6B6B6B}
.login-code-btn:disabled,.login-code-btn.is-off{background:#F0F1F3;color:#9CA3AF;cursor:not-allowed}
.login-nav-btn{width:2.25rem;height:2.25rem;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#111;background:transparent;transition:background .15s}
.login-nav-btn:active{background:#F0F1F3}
.login-lang-chip{display:inline-flex;align-items:center;gap:4px;max-width:8.5rem;height:2.25rem;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:600;color:#111;background:#F5F6F8;cursor:pointer;transition:background .15s}
.login-lang-chip:active{background:#EBECEF}
.login-brand-mark{width:4.5rem;height:4.5rem;border-radius:1.25rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#2F6FEB 0%,#1E56C9 100%);box-shadow:0 8px 20px rgba(47,111,235,.28);color:#fff}
.login-cb{width:18px;height:18px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid #D0D0D0;background:#fff;transition:all .15s;margin-top:1px}
.login-cb.on{background:#FF6A00;border-color:#FF6A00;color:#fff}
.login-link{color:#FF6A00;font-weight:500}
.login-submit{width:100%;padding:14px 16px;border-radius:12px;font-size:16px;font-weight:700;border:none;transition:background .15s,color .15s,opacity .15s}
.login-submit.is-on{background:#1E56C9;color:#fff;cursor:pointer}
.login-submit.is-on:active{background:#1847A8}
.login-submit.is-off{background:#E8E8EC;color:#A0A0A8;cursor:not-allowed}
.login-switch-primary{color:#2F6FEB;font-weight:600;font-size:14px;cursor:pointer}
.login-switch-sec{display:inline-flex;align-items:center;gap:5px;color:#6B6B6B;font-size:13px;cursor:pointer}
.login-switch-sec:active{opacity:.7}
.login-clear{width:20px;height:20px;border-radius:9999px;background:#D8D8DC;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="app" class="od-stage">
<div class="w-[393px] h-[852px] bg-black rounded-[55px] p-3 relative shrink-0" style="box-shadow:0 0 0 2px #333,0 30px 60px rgba(0,0,0,.35)">
<div class="absolute top-[23px] left-1/2 -translate-x-1/2 w-[126px] h-[37px] bg-black rounded-[20px] z-[2000]"></div>
<div class="w-full h-full bg-[#F6F7F9] rounded-[44px] overflow-hidden flex flex-col relative">

<!-- ═══ Toast ═══ -->
<div class="toast-wrap"><transition-group name="toast"><div v-for="t in toasts" :key="t.id" class="toast-item" :class="'toast-'+t.type">{{ t.msg }}</div></transition-group></div>

<!-- ═══ 全局区号选择（登录 / 绑定 / 账号 / 客服 共用） ═══ -->
<div v-if="showDialPicker" class="absolute inset-0 z-[1950] bg-[#F6F7F9] flex flex-col rounded-[44px] overflow-hidden" data-od-id="dialcode-page">
<div class="pt-14 px-4 pb-3 flex items-center gap-3 bg-white shrink-0" style="border-bottom:1px solid #E5E5E5">
<div class="w-9 h-9 rounded-full flex items-center justify-center cursor-pointer active:bg-[#F6F7F9]" @click="closeDialPicker"><span v-html="luci('arrow-left','w-5 h-5')"></span></div>
<div class="flex-1 relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#999]" v-html="luci('search','w-4 h-4')"></span>
<input v-model="dialQ" type="text" placeholder="搜索国家/地区或区号" class="login-field w-full pl-9 pr-9 py-2.5 text-[14px] outline-none">
<div v-if="dialQ" @click="dialQ=''" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-[#E5E5E5] flex items-center justify-center cursor-pointer"><span v-html="luci('x','w-3.5 h-3.5 text-[#666]')"></span></div>
</div>
</div>
<div class="flex-1 overflow-y-auto hide-scroll px-3 py-2">
<div v-for="c in dialFiltered" :key="c.code+c.name" @click="pickDial(c)"
  class="flex items-center gap-3 px-3.5 py-3.5 mb-1.5 rounded-xl cursor-pointer"
  :style="activeDialCode===c.code ? 'background:#EBF2FF;box-shadow:inset 0 0 0 1px #2F6FEB' : 'background:#fff'"
  :data-od-id="'dial-'+c.code">
<span class="text-[22px] w-8 text-center shrink-0">{{ c.flag }}</span>
<span class="flex-1 text-[15px] min-w-0" :class="activeDialCode===c.code ? 'font-semibold text-[#2F6FEB]' : 'font-medium text-[#111]'">{{ c.name }}</span>
<span class="text-[14px] tabular-nums shrink-0" :class="activeDialCode===c.code ? 'font-semibold text-[#2F6FEB]' : 'text-[#6B6B6B]'">{{ c.code }}</span>
</div>
  <div v-if="!dialFiltered.length" class="py-16 text-center text-[14px] text-[#999]">未找到匹配地区</div>
</div>
</div>

<!-- ═══ CS HOUR-MINUTE PICKER (global bottom sheet，跨 Tab 可用) ═══ -->
<transition name="fd"><div v-if="hmPicker" class="absolute inset-0 z-[1850]" style="background:rgba(0,0,0,.45)" @click="cancelHmPicker" data-od-id="cs-hm-mask"></div></transition>
<transition name="sh">
<div v-if="hmPicker" class="absolute bottom-0 left-0 right-0 bg-white z-[1851] rounded-t-[20px] flex flex-col" data-od-id="cs-hm-time-sheet" @click.stop>
<div class="flex items-center justify-between px-5 pt-4 pb-3 shrink-0">
<span class="text-[15px] text-[#6B6B6B] cursor-pointer active:opacity-70" @click="cancelHmPicker">取消</span>
<span class="text-[16px] font-semibold text-[#111]">{{ hmPicker==='start'?'选择开始时间':'选择结束时间' }}</span>
<span class="text-[15px] font-semibold text-[#2F6FEB] cursor-pointer active:opacity-70" @click="confirmHmPicker">确定</span>
</div>
<div class="relative px-2 pb-8">
<div class="track-wheel-mask"></div>
<div class="flex items-stretch gap-0.5">
<div class="track-wheel-col" ref="hmWheelHour" @scroll="onHmWheelScroll('hour',$event)">
<div style="height:72px"></div>
<div v-for="h in trackHours" :key="'hmh'+h" class="track-wheel-item" :class="{'is-on':hmDraft.hour===h}" @click="setHmHour(h)">{{ p2(h) }}时</div>
<div style="height:72px"></div>
</div>
<div class="track-wheel-col" ref="hmWheelMin" @scroll="onHmWheelScroll('min',$event)">
<div style="height:72px"></div>
<div v-for="mi in hmMins" :key="'hmm'+mi" class="track-wheel-item" :class="{'is-on':hmDraft.min===mi}" @click="setHmMin(mi)">{{ p2(mi) }}分</div>
<div style="height:72px"></div>
</div>
</div>
</div>
</div>
</transition>

<!-- ═══ LOGIN ═══ -->
<transition name="fd"><div v-if="showLogin" class="absolute inset-0 z-[1900] bg-[#F6F7F9] flex flex-col rounded-[44px] overflow-hidden" data-od-id="login-page">

<!-- 登录主界面 -->
<div v-show="loginView==='main'" class="flex-1 flex flex-col min-h-0 bg-[#F6F7F9]">
<div class="pt-14 px-5 pb-1 flex items-center justify-end shrink-0">
<button type="button" class="login-lang-chip" @click="loginOpenLang" data-od-id="login-lang-btn">
<span class="text-[#6B6B6B]" v-html="luci('globe','w-3.5 h-3.5')"></span>
<span class="truncate">{{ appLangLabel }}</span>
<span class="text-[#9CA3AF]" v-html="luci('chevron-down','w-3.5 h-3.5')"></span>
</button>
</div>
<div class="px-8 pt-3 pb-5 shrink-0 flex flex-col items-center" data-od-id="login-brand">
<div class="login-brand-mark" aria-hidden="true">
<span v-html="luci('bike','w-8 h-8')"></span>
</div>
</div>

<div class="flex-1 overflow-y-auto hide-scroll px-5 pb-10">
<div class="form-card" data-od-id="login-form-card">
<!-- 手机号登录 -->
<template v-if="loginMode==='phone'">
<div class="form-row" data-od-id="login-phone-row">
<div class="form-label">手机号</div>
<div class="flex items-stretch gap-2.5">
<div @click="openDialCode('login')" class="login-field login-field-dial flex items-center justify-center" data-od-id="login-dial-trigger">
<span class="text-[15px] font-semibold tabular-nums text-[#111]">{{ loginDial }}</span>
<span class="text-[#9CA3AF]" v-html="luci('chevron-down','w-3.5 h-3.5')"></span>
</div>
<div class="login-field flex-1 relative flex items-center min-w-0">
<input v-model="loginPhone" type="tel" inputmode="numeric" placeholder="请输入手机号" class="w-full pl-3.5 pr-9 py-3.5 text-[15px]" @input="loginPhone=loginPhone.replace(/\D/g,'')">
<div v-if="loginPhone" @click="loginPhone=''" class="login-clear absolute right-2.5"><span v-html="luci('x','w-3 h-3 text-[#666]')"></span></div>
</div>
</div>
</div>
<div v-if="loginSub==='password'" class="form-row" data-od-id="login-pwd-row">
<div class="form-label">密码</div>
<div class="login-field relative flex items-center">
<input v-model="loginPwd" :type="loginPwdVisible?'text':'password'" placeholder="请输入密码" class="w-full pl-3.5 pr-20 py-3.5 text-[15px]" @keyup.enter="doLogin">
<div class="absolute right-2 flex items-center gap-0.5">
<div v-if="loginPwd" @click="loginPwd=''" class="login-clear"><span v-html="luci('x','w-3 h-3 text-[#666]')"></span></div>
<div @click="loginPwdVisible=!loginPwdVisible" class="w-8 h-8 flex items-center justify-center cursor-pointer text-[#6B6B6B]"><span v-html="luci(loginPwdVisible?'eye-off':'eye','w-4 h-4')"></span></div>
</div>
</div>
</div>
<div v-else class="form-row" data-od-id="login-sms-row">
<div class="form-label">验证码</div>
<div class="flex items-stretch gap-2.5">
<div class="login-field flex-1 relative flex items-center min-w-0">
<input v-model="loginCode" type="tel" inputmode="numeric" maxlength="6" placeholder="请输入验证码" class="w-full pl-3.5 pr-9 py-3.5 text-[15px]" @input="loginCode=loginCode.replace(/\D/g,'').slice(0,6)" @keyup.enter="doLogin">

const hmPicker=ref(null);
const hmDraft=ref({hour:9,min:0});
const hmMins=[0,30];
const hmWheelHour=ref(null),hmWheelMin=ref(null);
let hmWheelTimers={};
function openHmPicker(which){
  const src=which==='start'?{hour:fc.value.sh,min:fc.value.sm}:{hour:fc.value.eh,min:fc.value.em};
  let min=src.min;
  if(min!==0&&min!==30)min=min<15?0:30;
  hmDraft.value={hour:Number(src.hour)||0,min};
  hmPicker.value=which==='end'?'end':'start';
  if(fE.value&&fE.value.time){const e={...fE.value};delete e.time;fE.value=e}
  nextTick(()=>scrollHmWheelsToDraft());
}
function setHmHour(h){hmDraft.value={...hmDraft.value,hour:h};nextTick(()=>scrollHmWheelsToDraft())}
function setHmMin(m){hmDraft.value={...hmDraft.value,min:m};nextTick(()=>scrollHmWheelsToDraft())}
function cancelHmPicker(){hmPicker.value=null}
function confirmHmPicker(){
  const h=hmDraft.value.hour,m=hmDraft.value.min;
  if(hmPicker.value==='start'){fc.value={...fc.value,sh:h,sm:m}}
  else{fc.value={...fc.value,eh:h,em:m}}
  hmPicker.value=null;
}
function scrollHmWheelsToDraft(){
  const d=hmDraft.value;
  if(hmWheelHour.value)hmWheelHour.value.scrollTop=Math.max(0,trackHours.indexOf(d.hour))*36;
  if(hmWheelMin.value)hmWheelMin.value.scrollTop=Math.max(0,hmMins.indexOf(d.min))*36;
}
function onHmWheelScroll(kind,e){
  clearTimeout(hmWheelTimers[kind]);
  hmWheelTimers[kind]=setTimeout(()=>{
    const el=e.target;
    const idx=Math.round(el.scrollTop/36);
    el.scrollTop=idx*36;
    const d={...hmDraft.value};
    if(kind==='hour')d.hour=trackHours[Math.min(Math.max(idx,0),23)];
    if(kind==='min')d.min=hmMins[Math.min(Math.max(idx,0),hmMins.length-1)];
    hmDraft.value=d;
  },80);
}
